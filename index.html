<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="calculator">
        <div id="history"></div>
        <input type="text" id="display" placeholder="0" readonly>
        <div class="button-container">
            <button class="button action-btn" data-action="clear">C</button>
            <button class="button action-btn" data-action="delete">DEL</button>
            <button class="button op-btn" data-val="/">/</button>
            <button class="button op-btn" data-val="*">*</button>

            <button class="button" data-val="7">7</button>
            <button class="button" data-val="8">8</button>
            <button class="button" data-val="9">9</button>
            <button class="button op-btn" data-val="-">-</button>

            <button class="button" data-val="4">4</button>
            <button class="button" data-val="5">5</button>
            <button class="button" data-val="6">6</button>
            <button class="button op-btn" data-val="+">+</button>

            <button class="button" data-val="1">1</button>
            <button class="button" data-val="2">2</button>
            <button class="button" data-val="3">3</button>
            <button class="button equal-btn" data-action="calculate">=</button>

            <button class="button zero-btn" data-val="0">0</button>
            <button class="button" data-val=".">.</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
